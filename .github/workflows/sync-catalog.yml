name: Sincronizar catálogo de precios (SEPA)

on:
  schedule:
    # 12:17 hora de Argentina (15:17 UTC). SEPA publica el ZIP del día entre las 6 y las 10;
    # minuto "raro" a propósito porque GitHub demora los cron en punto.
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Día del ZIP (lunes..domingo). Vacío = hoy'
        required: false
      dry_run:
        description: 'Solo mostrar el resumen, sin escribir en la base'
        type: boolean
        default: false

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Sincronizar
        # Los inputs van por variables de entorno (no interpolados en el shell); el script valida el día.
        run: npm run sync:catalog -- $SYNC_DAY $SYNC_FLAGS
        env:
          SYNC_DAY: ${{ inputs.day }}
          SYNC_FLAGS: ${{ inputs.dry_run && '--dry-run' || '' }}
          # Conexión directa (sin pooler): son escrituras largas.
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SYNC_MIN_STORES: ${{ vars.SYNC_MIN_STORES || '3' }}
          DEMO_PRODUCTS_PER_CATEGORY: ${{ vars.DEMO_PRODUCTS_PER_CATEGORY || '10' }}
          NODE_OPTIONS: --max-old-space-size=4096
